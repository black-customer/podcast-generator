<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="reference.css"><title>B07 看中文口答</title></head><body><div class="shell"><aside><div class="brand">IELTS Pod</div><div class="brand-sub">私人英语自习室</div><nav><div class="nav"><span class="ico">⌂</span>开始练习</div><div class="nav active"><span class="ico">▤</span>我的语料</div><div class="nav"><span class="ico">▤</span>句子复习</div><div class="nav"><span class="ico">▷</span>正在播放</div><div class="nav"><span class="ico">⚙</span>设置</div></nav><div class="aside-foot">听见自己的意思，<br>练成自己的表达。</div></aside><main><div class="crumb"><span>我的语料　／　日常生活　／　学习</span><span class="crumbmark">概念预览</span></div><div class="page"><div class="row" style="justify-content:space-around;border-bottom:1px solid var(--line);padding:10px 0 22px;margin-bottom:20px"><span>✓ 先回答</span><span>✓ 逐句默写</span><strong style="color:var(--olive)">③ 看中文说</strong><span>④ 脱稿说</span></div><h1>看着中文，完整回答一遍</h1><p class="sub">中文只提示内容，试着连贯地说。</p><div class="question" style="margin:12px 0 18px">What do you usually do after work?</div><div class="card" style="font-size:21px;line-height:1.72"><p>1　我通常下班后去散步。</p><p>2　这能让我放松下来。</p><p>3　比起刷手机，我更喜欢散步。</p><p>4　有时我会在路上听一集播客。</p><p>5　等我到家时，我感觉放松多了。</p></div><div class="playerbar" style="text-align:center;padding:18px"><div class="hint">00:00</div><span class="circle" style="margin:8px auto 14px;width:70px;height:70px">●</span><button class="btn primary" style="min-width:260px">开始录音</button><p class="hint" style="margin-top:12px">录制结束后可回听，保存后进入脱稿回答。</p></div><p class="hint" style="margin-top:20px">保存并退出</p></div></main></div></body></html>
