<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="reference.css"><title>A05 概念图</title></head><body><div class="shell"><aside><div class="brand">IELTS Pod</div><div class="brand-sub">私人英语自习室</div><nav><div class="nav"><span class="ico">⌂</span class="active">开始练习</div><div class="nav"><span class="ico">▤</span>我的语料</div><div class="nav"><span class="ico">▤</span>句子复习</div><div class="nav"><span class="ico">▷</span>正在播放</div><div class="nav"><span class="ico">⚙</span>设置</div></nav><div class="aside-foot">听见自己的意思，<br>练成自己的表达。</div></aside><main><div class="crumb"><span>IELTS Pod　／　开始练习　／　A05</span><span class="crumbmark">概念预览</span></div><div class="page"><h1>先说出你真正想表达的意思</h1><p class="sub">中文、英文或中英混合都可以；原始回答会保留。</p><div class="divider"></div><span class="pill">Part 1 · 日常生活</span><div class="question">What do you usually do after work?</div><h2>我的原始回答</h2><div class="card" style="min-height:250px;font-size:21px">我下班常去散步。It help me relaxed. 比起刷手机我更喜欢走路。<br>有时路上听播客，到家感觉轻松。</div><div class="row" style="gap:20px;margin:30px 0"><label class="card" style="width:45%;margin:0;border-color:var(--olive)">●　Agent 模式 <span class="hint">默认</span><div class="hint" style="margin:6px 0 0 26px">生成自然英文、音频，并按支持的流程准备学习材料。</div></label><label class="card" style="width:45%;margin:0">○　API 模式<div class="hint" style="margin:6px 0 0 26px">使用已配置的服务完成同一条生成链。</div></label></div><button class="btn primary" style="min-width:340px">生成我的语料</button><p class="hint" style="margin-top:25px">音频完成后即可收听；逐句讲解的准备状态单独显示。</p></div></main></div></body></html>
